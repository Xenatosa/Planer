  {id:"mark-hut",category:"research",name:"Schamanenhütte",art:"shaman",count:"0/1",costs:[["wood",1350],["food",550]]},
  {id:"ancestor-circle",category:"research",name:"Ahnenkreis",art:"center4",count:"0/1",costs:[["stone",1800],["shells",240]]},
  {id:"knowledge-stone",category:"research",name:"Wissensplatz",art:"gatherer4",count:"0/1",costs:[["stone",2300],["food",620]]},
  {id:"cave-paint",category:"research",name:"Felszeichen",art:"shaman4",count:"0/1",locked:"RATHAUS 3",costs:[["wood",2100],["shells",480]]},
  {id:"shell-path",category:"decor",name:"Muschelpfad",art:"shell4",count:"0/3",costs:[["shells",160],["stone",90]]},
  {id:"bone-arch",category:"decor",name:"Knochenbogen",art:"palisade",count:"0/1",costs:[["wood",470],["stone",180]]},
  {id:"ancestor-pole",category:"decor",name:"Ahnentotem",art:"shaman4",count:"0/2",costs:[["wood",520],["shells",120]]},
  {id:"ember-stone",category:"decor",name:"Glutstein",art:"quarry4",count:"0/3",costs:[["stone",360],["shells",90]]},
  {id:"hide-banner",category:"decor",name:"Fellbanner",art:"gatherer4",count:"0/2",costs:[["wood",640],["food",180]]}
];
const categories=[
  {id:"economy",name:"Wirtschaft",icon:'<svg viewBox="0 0 32 32"><path d="M4 15 16 5l12 10M7 14v13h18V14M13 27v-8h6v8"/></svg>'},
  {id:"military",name:"Militär",icon:'<svg viewBox="0 0 32 32"><path d="m8 5 18 18M24 5 6 23M7 5l4 1 2 4-4 4-4-2-1-4ZM25 19l3 4-2 4-5-1-2-4 3-3Z"/><path d="m13 15 4 4"/></svg>'},
  {id:"research",name:"Forschung",icon:'<svg viewBox="0 0 32 32"><path d="M16 3v7M16 22v7M3 16h7M22 16h7M6.8 6.8l5 5M20.2 20.2l5 5M25.2 6.8l-5 5M11.8 20.2l-5 5"/><circle cx="16" cy="16" r="4"/></svg>'},
  {id:"decor",name:"Deko",icon:'<svg viewBox="0 0 32 32"><path d="M16 4c-3 4-3 8 0 12 3-4 3-8 0-12ZM28 16c-4-3-8-3-12 0 4 3 8 3 12 0ZM16 28c3-4 3-8 0-12-3 4-3 8 0 12ZM4 16c4 3 8 3 12 0-4-3-8-3-12 0Z"/><circle cx="16" cy="16" r="2.4"/></svg>'}
];
const counts={economy:9,military:7,research:4,decor:5};
const resourcesAtHand={wood:12480,stone:8215,food:14900,shells:3270};
const rail=document.getElementById("category-rail");
const track=document.getElementById("cards-track");
const viewport=document.querySelector(".cards-viewport");
const dots=document.getElementById("page-dots");
let activeCategory="economy";
let activePage=0;
let normalizedImages={};
let imagePromises={};
let selectedBuilding=catalog.find(item=>item.id==="tribe-fire");

function format(n){return n.toLocaleString("de-DE");}
function lockIcon(){return '<svg viewBox="0 0 20 22" aria-hidden="true"><path d="M5 9V6a5 5 0 0 1 10 0v3M3 9h14v11H3zM10 13v3"/></svg>';}
function makeNormalizedImage(id){
  if(normalizedImages[id]) return Promise.resolve(normalizedImages[id]);
  if(imagePromises[id]) return imagePromises[id];
  const spec=buildingsById[id];
  imagePromises[id]=new Promise((resolve,reject)=>{
    const source=new Image();
    source.onload=()=>{
      const [x1,y1,x2,y2]=spec.box;
      const cropW=x2-x1,cropH=y2-y1;
      const canvas=document.createElement("canvas");
      canvas.width=512;canvas.height=512;
      const ctx=canvas.getContext("2d");
      const scale=Math.min(448/cropW,448/cropH);
      const width=cropW*scale,height=cropH*scale;
      ctx.drawImage(source,x1,y1,cropW,cropH,(512-width)/2,512-25-height,width,height);
      try{normalizedImages[id]=canvas.toDataURL("image/png");resolve(normalizedImages[id]);}
      catch(e){reject(e);}
    };
    source.onerror=()=>reject(new Error("Gebäudeabbildung fehlt: "+spec.file));
    source.src=ASSET+spec.file;
  });
  return imagePromises[id];
}
function setBuildingImage(img,id){
  makeNormalizedImage(id).then(src=>{img.src=src;});
}
function drawCategories(){
  rail.innerHTML="";
  categories.forEach(cat=>{
    const button=document.createElement("button");
    button.className="category"+(cat.id===activeCategory?" active":"");
    button.type="button";
    button.setAttribute("aria-label",cat.name+", "+counts[cat.id]+" Gebäude");
    button.innerHTML='<span class="category-orb">'+cat.icon+'</span><span class="category-name">'+cat.name+'</span><small class="category-count-badge">'+counts[cat.id]+'</small>';
    button.addEventListener("click",()=>selectCategory(cat.id));
    rail.appendChild(button);
  });
  document.querySelector("#category-total").textContent=counts[activeCategory];
}
function costChip([resourceId,amount]){
  const resource=resources[resourceId];
  const missing=amount>resourcesAtHand[resourceId];
  return '<div class="cost-chip'+(missing?" insufficient":"")+'" title="'+resource.name+": "+format(amount)+'"><img src="'+resource.icon+'" alt=""><b'+(missing?' style="color:var(--red)"':"")+'>'+format(amount)+'</b></div>';
}
function drawCards(){
  const entries=catalog.filter(item=>item.category===activeCategory);
  track.innerHTML="";
  entries.forEach(item=>{
    const card=document.createElement("article");
    card.className="building-card "+(item.locked?"locked":"buildable");
    const lockNote=item.locked?'<div class="lock-note">'+lockIcon()+item.locked+'</div>':"";
    card.innerHTML='<div class="art-stage"><span class="plinth"></span><img class="art-image" data-building="'+item.art+'" alt="'+item.name+'"><span class="count-badge">'+item.count+'</span>'+lockNote+'</div><div class="building-name">'+item.name+'</div><div class="cost-row">'+item.costs.slice(0,2).map(costChip).join("")+'</div>';
    setBuildingImage(card.querySelector(".art-image"),item.art);
    if(item.locked){card.setAttribute("aria-label",item.name+", gesperrt, "+item.locked);}
    else {card.setAttribute("aria-label",item.name+", Kosten "+item.costs.map(([r,n])=>resources[r].name+" "+format(n)).join(", "));}
    card.addEventListener("click",()=>{
      if(item.locked||item.costs.some(([resourceId,amount])=>amount>resourcesAtHand[resourceId])) return;
      selectedBuilding=item;
      document.body.dataset.screen="place";
      drawTooltip(item);
    });
    track.appendChild(card);
  });
  drawDots(entries.length);
  viewport.scrollLeft=0;
}
function drawDots(length){
  const visible=viewport.clientWidth;
  const maxScroll=Math.max(0,track.scrollWidth-visible);
  const pageCount=Math.max(1,Math.ceil(track.scrollWidth/visible));
  dots.innerHTML="";
  for(let i=0;i<pageCount;i++){
    const dot=document.createElement("button");dot.type="button";dot.className="page-dot"+(i===activePage?" active":"");dot.setAttribute("aria-label","Seite "+(i+1)+" von "+pageCount);
    dot.addEventListener("click",()=>{viewport.scrollTo({left:pageCount===1?0:maxScroll*i/(pageCount-1),behavior:"smooth"});});
    dots.appendChild(dot);
  }
}
function selectCategory(id){
  activeCategory=id;activePage=0;drawCategories();drawCards();
}
viewport.addEventListener("scroll",()=>{
  const maxScroll=Math.max(0,viewport.scrollWidth-viewport.clientWidth);
  const next=maxScroll===0?0:Math.round((viewport.scrollLeft/maxScroll)*(dots.children.length-1));
  if(next!==activePage){activePage=next;const buttons=[...dots.children];buttons.forEach((dot,i)=>dot.classList.toggle("active",i===activePage));}
});
function drawTooltip(item=selectedBuilding){
  document.getElementById("placement-name").textContent=item.name.toLocaleUpperCase("de-DE");
  const art=document.querySelector(".ghost-art");
  art.dataset.building=item.art;
  art.alt="Halbtransparenter "+item.name+"-Bauplatz";
  setBuildingImage(art,item.art);
  const costs=item.allCosts||item.costs;
  const costList=document.getElementById("tooltip-costs");
  costList.style.gridTemplateColumns="repeat("+costs.length+",1fr)";
  costList.innerHTML=costs.map(([id,amount])=>'<div class="tooltip-cost" title="'+resources[id].name+" "+format(amount)+'"><img src="'+resources[id].icon+'" alt=""><b>'+format(amount)+'</b></div>').join("");
}
document.querySelector(".action-orb.cancel").addEventListener("click",()=>{document.body.dataset.screen="shop";});
document.querySelector(".action-orb.confirm").addEventListener("click",()=>{
  const [current,maximum]=selectedBuilding.count.split("/").map(Number);
  if(current<maximum) selectedBuilding.count=(current+1)+"/"+maximum;
  document.body.dataset.screen="shop";
  drawCards();
});
const screen=new URLSearchParams(location.search).get("screen")==="place"?"place":"shop";
document.body.dataset.screen=screen;
if(screen==="shop"){drawCategories();drawCards();}
drawTooltip(selectedBuilding);
document.querySelectorAll("[data-building]").forEach(img=>setBuildingImage(img,img.dataset.building));
Promise.all([...document.querySelectorAll("[data-building]")].map(img=>makeNormalizedImage(img.dataset.building))).then(()=>document.fonts.ready).then(()=>{window.renderReady=true;}).catch(error=>{document.body.dataset.renderError=error.message;console.error(error);});
</script>
